#version: "3.6"

networks:
    app-network:
        name: app-network
        external: true

services:
    app:
        image: gt/app:latest
        container_name: app
        build:
            context: ./
            dockerfile: .docker/app/Dockerfile
        volumes:
            - ./:/var/www/html
            - ./shared:/var/shared
            - ./xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
#            - ./dist/assets:/var/www/html/app/assets
        environment:
            BASEDIR: /var/www/html
#            COMPOSER_AUTH: '${COMPOSER_AUTH}'
            HOME: /var/www/html
            PHP_IDE_CONFIG: 'serverName=app.dv'
#        ports:
#            - "5173:5173"
#            - "3000:3000"
        networks:
            - app-network

    web:
        image: gt/web:latest
        container_name: web
        build:
            context: ./
            dockerfile: .docker/web/Dockerfile
        links:
            - app:php_fpm
        ports:
            - "8181:80"
        environment:
            - BASEDIR=/var/www/html

        volumes:
            - ./.docker/web/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
            - ./:/var/www/html
            - ./shared:/var/shared

        networks:
            - app-network

        depends_on:
            - app
